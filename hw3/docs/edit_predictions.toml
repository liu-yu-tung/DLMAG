# Addendum 11-15 19:09 (main), before any edited clip exists (edits_generate has not started). Ranges above are unchanged.
# Reason: with 12 pairs, a word the model ignores still moves the expected way in about 6 (p = 0.5 each); P(>=9) = 0.073,
# P(>=10) = 0.019, so a range starting at 6-7 can be "met" by chance. Added before results, so it is planned analysis:
# 1. Each count is reported with its one-sided binomial p (chance = 6 of 12), Holm-corrected over the 8 axes.
# 2. Magnitude, not only sign: mean edited-minus-original change with a sign-flip permutation p (10000 flips, seed 0) and a
#    paired bootstrap interval (1000, seed 0).
# 3. Seed-noise scale: the same detector's change between seed 0 and seeds 1-2 of the original caption (no word changed);
#    the edit effect is reported as a multiple of that spread.
# 4. Specificity: the target-minus-source probe must move more than the mean of the unrelated probes (same category excluded).
# 5. Extended set: every other eligible caption (143 more clips, runs edit_<axis>_ext) is pooled with the 12 as a second,
#    larger test. The predictions above are scored on the 12 only.

[[analysis]]
written = "2026-11-15 19:09"
chance_count = 6
binomial_p_at_9 = 0.073
binomial_p_at_10 = 0.019
correction = "holm over 8 axes"
extended_runs = "edit_<axis>_ext"

