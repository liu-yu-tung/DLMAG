    { name = "liuyu", email = "57765519+liu-yu-tung@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.15.0",
    "huggingface-hub>=1.33.0",
    "joblib>=1.6.0",
    "librosa>=1.0.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "pandas>=3.0.6",
    "safetensors>=0.8.0",
